<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NNDYM Spelling Bee</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; text-align: center; padding: 20px; }
    .card { background: white; max-width: 500px; margin: 20px auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #2c3e50; margin-bottom: 20px; }
    select, input { font-size: 18px; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; width: 80%; box-sizing: border-box; }
    button { font-size: 18px; padding: 12px 24px; margin: 10px 5px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-audio { background-color: #3498db; color: white; }
    .btn-audio:hover { background-color: #2980b9; }
    .btn-submit { background-color: #2ecc71; color: white; width: 80%; }
    .btn-submit:hover { background-color: #27ae60; }
    .pos { color: #8e44ad; font-weight: bold; font-size: 16px; text-transform: uppercase; margin-top: 10px; }
    .hint { color: #555; font-style: italic; margin: 10px 0 20px 0; min-height: 45px; line-height: 1.4; }
    .feedback { font-weight: bold; font-size: 20px; margin-top: 15px; }
    .correct { color: #27ae60; }
    .wrong { color: #c0392b; }
    .counter { color: #7f8c8d; font-size: 14px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐝 NNDYM Spelling Bee</h1>
    
    <label for="weekSelect" style="font-weight: bold; color: #34495e;">Select Week:</label><br>
    <select id="weekSelect" onchange="filterWeek()"></select>

    <div style="margin: 15px 0;">
      <button class="btn-audio" onclick="speakWord()">🔊 Listen to Word</button>
    </div>

    <div class="pos" id="posText"></div>
    <div class="hint" id="hintText">Loading words...</div>

    <input type="text" id="userInput" placeholder="Type word here..." autocomplete="off" onkeypress="handleKeyPress(event)">
    <br>
    <button class="btn-submit" onclick="checkSpelling()">Submit Answer</button>

    <div class="feedback" id="feedback"></div>
    <div class="counter" id="counter"></div>
  </div>

  <script>
    // ⚠️ PASTE YOUR PUBLISHED GOOGLE SHEET CSV LINK BELOW INSIDE QUOTES:
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSRZ0oi5EBhQluPga2K658LaYw5ifDb8Qdnmkjz9I_2LqnUx-wF6rtWE2rrORblpi6tMlSNWEXT1QSR/pub?output=csv";

    let allWords = [];
    let currentPool = [];
    let currentIndex = 0;

    fetch(SHEET_CSV_URL)
      .then(res => res.text())
      .then(csvText => {
        const rows = parseCSV(csvText);
        // Skip header row (i=1)
        for (let i = 1; i < rows.length; i++) {
          if (rows[i].length >= 2 && rows[i][1]) {
            allWords.push({
              week: rows[i][0].trim(),
              word: rows[i][1].trim().toUpperCase(),
              pos: rows[i][2] ? rows[i][2].trim() : '',
              hint: rows[i][3] ? rows[i][3].trim() : ''
            });
          }
        }
        populateWeeks();
      })
      .catch(err => {
        document.getElementById('hintText').innerText = "Failed to load sheet data. Please check CSV URL.";
      });

    // Helper to handle commas inside quoted definitions
    function parseCSV(text) {
      let lines = text.split('\n');
      return lines.map(line => {
        let regex = /(?:\"([^\"]*)\"|([^,]+))/g;
        let row = [];
        let match;
        while ((match = regex.exec(line)) !== null) {
          row.push(match[1] || match[2] || '');
        }
        return row;
      });
    }

    function populateWeeks() {
      const select = document.getElementById('weekSelect');
      const weeks = [...new Set(allWords.map(item => item.week))];
      select.innerHTML = '<option value="ALL">All Weeks (Master List)</option>';
      weeks.forEach(w => {
        select.innerHTML += `<option value="${w}">${w}</option>`;
      });
      filterWeek();
    }

    function filterWeek() {
      const selected = document.getElementById('weekSelect').value;
      if (selected === 'ALL') {
        currentPool = [...allWords];
      } else {
        currentPool = allWords.filter(w => w.week === selected);
      }
      currentIndex = 0;
      loadWord();
    }

    function loadWord() {
      document.getElementById('feedback').innerText = "";
      document.getElementById('userInput').value = "";
      if (currentPool.length > 0) {
        document.getElementById('posText').innerText = currentPool[currentIndex].pos ? "(" + currentPool[currentIndex].pos + ")" : "";
        document.getElementById('hintText').innerText = currentPool[currentIndex].hint ? currentPool[currentIndex].hint : "No hint provided.";
        document.getElementById('counter').innerText = "Word " + (currentIndex + 1) + " of " + currentPool.length;
        speakWord();
      }
    }

    function speakWord() {
      if (currentPool.length > 0) {
        window.speechSynthesis.cancel(); // Reset audio queue
        const msg = new SpeechSynthesisUtterance(currentPool[currentIndex].word);
        msg.rate = 0.8; // Slower pace for young learners
        window.speechSynthesis.speak(msg);
      }
    }

    function checkSpelling() {
      const userAns = document.getElementById('userInput').value.trim().toUpperCase();
      const target = currentPool[currentIndex].word;
      const feedback = document.getElementById('feedback');

      if (userAns === target) {
        feedback.innerText = "🎉 Correct! Great job!";
        feedback.className = "feedback correct";
        setTimeout(() => {
          currentIndex = (currentIndex + 1) % currentPool.length;
          loadWord();
        }, 1200);
      } else {
        feedback.innerText = "❌ Try again!";
        feedback.className = "feedback wrong";
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        checkSpelling();
      }
    }
  </script>
</body>
</html>
